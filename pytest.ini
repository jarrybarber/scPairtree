[pytest]
# Only look for tests in tests/. Without this, pytest would also try to run
# scripts in experiments/ whose names happen to start with "test_".
testpaths = tests

# Labels that can be attached to tests with @pytest.mark.<name>.
# --strict-markers makes a misspelled label an error rather than silently
# creating a new one.
markers =
    slow: tests that run the full pipeline and take a while (skip with -m "not slow")
addopts = --strict-markers
