<script type="text/javascript">// 'letters' or 'digits'
var LABEL_TYPE = 'digits';
// 'circle' or 'square'
var NODE_TYPE = 'circle';

// Following two functions from https://stackoverflow.com/a/18473154.
function polarToCartesian(centerX, centerY, radius, angleInDegrees) {
  // Add 90 degrees to rotate coordinate system so that arcs start at the
  // bottom of the circle and rotate clockwise.
  var angleInRadians = (angleInDegrees + 90) * Math.PI/180.0;
  return {
    x: centerX + (radius * Math.cos(angleInRadians)),
    y: centerY + (radius * Math.sin(angleInRadians))
  };
}

function describeArc(x, y, radius, startAngle, endAngle) {
  var start = polarToCartesian(x, y, radius, startAngle);
  var end = polarToCartesian(x, y, radius, endAngle);
  var largeArcFlag = endAngle - startAngle <= 180 ? "0" : "1";
  var d = [
    "M", start.x, start.y,
    "A", radius, radius, 0, largeArcFlag, 1, end.x, end.y,
    "L", x, y,
    "L", start.x, start.y,
  ].join(" ");

  return d;
}

function describeRect(x, y, width, height) {
  var d = [
    "M", x, y,
    "H", x + width,
    "V", y + height,
    "H", x,
    "Z"
  ].join(" ");
  return d;
}

function TreePlotter() {
}

TreePlotter.prototype._calculate_max_depth = function(root) {
  var _calc_max_depth = function(node) {
    if(!node.hasOwnProperty('children')) {
      return 0;
    }
    var max_depth = 0;
    node.children.forEach(function(child) {
      var nd = _calc_max_depth(child);
      if(nd > max_depth)
        max_depth = nd;
    });
    return 1 + max_depth;
  };
  return _calc_max_depth(root);
}

TreePlotter.prototype._label_node = function(node_id) {
  if(LABEL_TYPE === 'digits') {
    return node_id;
  }
  // Restrict to valid alphabet range.
  if(node_id < 1 || node_id > 26) {
    return node_id;
  }
  var letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  return letters[node_id - 1];
}

TreePlotter.prototype._draw_tree = function(root, container, sampnames, samp_colours, pop_colours, bg_colour) {
  // horiz_padding should be set to the maximum radius of a node, so a node
  // drawn on a boundry won't go over the canvas edge. Since max_area = 8000,
  // we have horiz_padding = sqrt(8000 / pi) =~ 51.
  var horiz_padding = 51;
  var max_depth = this._calculate_max_depth(root);
  var m = [10, horiz_padding, 10, horiz_padding],
      w = Math.max(150, 120*max_depth - m[1] - m[3]),
      h = 430 - m[0] - m[2],
      i = 0;

  // Compute the new tree layout.
  var tree = d3.tree().size([h, w]);
  root = tree(d3.hierarchy(root));
  root.descendants().sort(function(a, b) {
    return d3.ascending(parseInt(a.data.name, 10), parseInt(b.data.name, 10));
  });
  var svg = container.append('svg:svg')
      .attr('width', w + m[1] + m[3])
      .attr('height', h + m[0] + m[2]);
  svg.append('svg:defs')
    .append('svg:marker')
    .attr('id', 'arrowhead')
    .attr('orient', 'auto')
    .attr('markerWidth', 10)
    .attr('markerHeight', 10)
    .attr('markerUnits', 'strokeWidth')
    .attr('refX', 0)
    .attr('refY', 3)
    .append('svg:path')
    .attr('d', 'M0,0 L0,6 L9,3 z');
  var vis = svg.append('svg:g')
      .attr('transform', 'translate(' + m[3] + ',' + m[0] + ')');

  // Update the nodes.
  var node = vis.selectAll('g.node')
      .data(root.descendants(), function(d) { return d.data.name; });

  var self = this;
  // Enter any new nodes at the parent's previous position.
  var nodeEnter = node.enter().append('svg:g');
  nodeEnter.attr('class', 'population')
    .attr('transform', function(d) { return 'translate(' + d.y + ',' + d.x + ')'; });

  if(NODE_TYPE === 'circle') {
    nodeEnter.append('svg:circle')
      .attr('class', 'outline')
      .attr('r', function(d) { return d.data.radius; });
  } else {
    nodeEnter.append('svg:rect')
      .attr('class', 'outline')
      .attr('x', function(d) { return -d.data.radius; })
      .attr('y', function(d) { return -d.data.radius; })
      .attr('width', function(d) { return 2*d.data.radius; })
      .attr('height', function(d) { return 2*d.data.radius; });
  }

  var choose_colour = function(node_idx, slice_idx, phi) {
    if(samp_colours !== null) {
      let [samp_name, base_colour] = samp_colours[slice_idx];
      let samp_idx = sampnames.indexOf(samp_name);
      let opacity = phi[samp_idx];
      return Util.blend_colours(base_colour, opacity, bg_colour);
    } else if(pop_colours !== null) {
      return pop_colours[node_idx];
    } else {
      return '#428bca';
    }
  };

  var slices = (samp_colours === null) ? 1 : samp_colours.length;
  var add_slice = function(slice_idx, total_slices) {
    if(!(0 <= slice_idx && slice_idx < total_slices)) {
      throw "wrong number of slices: " + slice_idx + ", " + total_slices;
    }
    nodeEnter.append('svg:path')
      .attr('d', function(d) {
        if (NODE_TYPE === 'circle') {
          var deg = 360 / total_slices;
          // Without this, Chrome will draw nothing when there's only a single slice.
          deg = Math.min(deg, 359.9);
          var start = slice_idx * deg;
          var end = (slice_idx + 1)*deg;
          return describeArc(0, 0, d.data.radius, start, end);
        } else {
          var total_width = 2*d.data.radius;
          var slice_width = total_width / total_slices;
          var x = -d.data.radius + (slice_idx * slice_width);
          return describeRect(x, -d.data.radius, slice_width, 2*d.data.radius);
        }
      }).attr('fill', function(d, i) {
        return choose_colour(d.data.name, slice_idx, d.data.phi);
      });
  };
  for(var idx = 0; idx < slices; idx++) {
    add_slice(idx, slices);
  }
  /*nodeEnter.append('svg:path')
    .attr('class', 'divider')
    .attr('stroke', '#aaa')
    .attr('d', function(d) { return 'M 0 -' + d.data.radius + ' V ' + d.data.radius; });*/

  nodeEnter.append('svg:text')
      .attr('font-size', '30')
      .attr('dominant-baseline', 'central')
      .attr('text-anchor', 'middle')
      .text(function(d) { return self._label_node(d.data.name); });

  // Update the links.
  var link = vis.selectAll('path.link')
      .data(root.links(), function(d) { return d.target.data.name; });

  // Enter any new links at the parent's previous position.
  var arrowhead_width = 14;
  link.enter()
    .insert('svg:path', 'g')
    .attr('marker-end', 'url(#arrowhead)')
    .attr('class', 'link')
    .attr('d', d3.linkHorizontal().source(function(d) {
      return [d.source.y + d.source.data.radius, d.source.x];
    }).target(function(d) {
      return [d.target.y - d.source.data.radius - arrowhead_width, d.target.x];
    }));
}

TreePlotter.prototype._generate_tree_struct = function(parents, phi, root_id) {
  var _add_node = function(node_id, struct) {
    struct.name = node_id;
    struct.radius = Math.sqrt(2000 / Math.PI);
    struct.phi = phi[node_id];

    var children = [];
    for(var idx = 0; idx < parents.length; idx++) {
      if(parents[idx] === node_id) {
        children.push(idx + 1);
      }
    }

    struct.children = [];
    children.forEach(function(child_id) {
      var child = {};
      struct.children.push(child);
      _add_node(child_id, child);
    });
  };

  var root = {};
  _add_node(root_id, root);
  return root;
}

TreePlotter.prototype.plot = function(root_id, parents, phi, sampnames, samp_colours, pop_colours, remove_normal, container) {
  container = d3.select(container).append('div');
  var bg_colour = '#ffffff';

  var root = this._generate_tree_struct(parents, phi, root_id);
  this._draw_tree(root, container, sampnames, samp_colours, pop_colours, bg_colour);
  resize_svg(container.selectAll('svg'));
}

</script>

function CongraphPlotter() {
  this._layout_options = {
    klay: {
      name: 'klay',
      animate: true,
      klay: {
        direction: 'RIGHT',
      },
    },

    fcose: {
      name: 'fcose',
    },
  };

  this._default_layout = this._layout = 'klay';
}

CongraphPlotter.prototype.plot = function(cgraph, container, threshold_display) {
  const self = this;
  const min_threshold = 0.01;
  const default_threshold = 0.05;

  const spanning_threshold = this._find_min_spanning_threshold(cgraph);
  if(spanning_threshold < min_threshold) {
    throw "spanning_threshold < min_threshold, implying some parts of the graph will always be disconnected";
  }
  d3.select('#spanning_threshold').text(Math.round(100*spanning_threshold) + '%');

  var [nodes, edges] = this._make_graph(cgraph, min_threshold);
  this._draw(nodes, edges, container);

  this._cy.ready(() => {
    self._config_layout_chooser('#layout_chooser');
    self._config_edge_weight_display();
    self._config_threshold_chooser('#threshold_chooser', '#congraph_threshold', min_threshold, default_threshold);
    self._config_exporters('#export_svg', '#export_png');
  });
}

CongraphPlotter.prototype._find_min_spanning_threshold = function(cgraph) {
  var K = cgraph.length;
  var threshold = 1;

  for(var J = 1; J < K; J++) {
    var max_J = 0;
    for(var I = 0; I < K; I++) {
      if(cgraph[I][J] > max_J) {
        max_J = cgraph[I][J];
      }
    }
    if(threshold > max_J) {
      threshold = max_J;
    }
  }
  return threshold;
}

CongraphPlotter.prototype._make_graph = function(cgraph, threshold=0.2) {
  var K = cgraph.length;
  var nodes = [];
  var edges = [];

  for(var I = 0; I < K; I++) {
    nodes.push({
      id: I,
      name: I,
      radius: 20,
    });
    for(var J = 0; J < K; J++) {
      if(cgraph[I][J] >= threshold) {
        edges.push({
          source: I,
          target: J,
          weight: cgraph[I][J],
        });
      }
    }
  }

  return [nodes, edges];
}

CongraphPlotter.prototype._config_threshold_chooser = function(chooser, label_elem, min_thresh, default_thresh) {
  let self = this;
  const all_edges = this._cy.edges();

  let _update_thresh = function(new_thresh) {
    d3.select(label_elem).text(Math.round(100*new_thresh) + '%');
    all_edges.restore();
    const bad = all_edges.filter(E => E.data().weight < new_thresh);
    bad.remove();
    self._run_layout();
  };
  _update_thresh(default_thresh);

  d3.select(chooser)
    .attr('min', min_thresh)
    .attr('max', 1.0)
    .attr('step', 0.01)
    .attr('value', default_thresh)
    .on('change', function(d) {
      const threshold = this.value;
      _update_thresh(threshold);
    });
}

CongraphPlotter.prototype._config_layout_chooser = function(chooser) {
  var self = this;

  chooser = d3.select(chooser);
  for(const layout of Object.keys(this._layout_options).sort()) {
    const option = chooser.insert('option').text(layout);
    if(layout == this._default_layout) {
      option.attr('selected', 'selected');
    }
  }

  chooser.on('change', function(d) {
    const new_layout = this.value;
    self._layout = new_layout;
    self._run_layout();
  });
}

CongraphPlotter.prototype._config_exporters = function(svg_sel, png_sel) {
  let self = this;
  d3.select(svg_sel).on('click', function(d) {
    let svg = self._cy.svg();
    let blob = new Blob([svg], {type:"image/svg+xml;charset=utf-8"})
    saveAs(blob, 'congraph.svg');
  });
  d3.select(png_sel).on('click', function(d) {
    let blob = self._cy.png({
      output: 'blob',
      scale: 5,
    });
    saveAs(blob, 'congraph.png');
  });
}

CongraphPlotter.prototype._config_edge_weight_display = function() {
  // See https://stackoverflow.com/a/54556015
  // and https://cytoscape.org/cytoscape.js-popper/demo-tippy.html
  this._cy.edges().forEach(function(edge) {
    var ref = edge.popperRef();
    const dummy = document.createElement('div');

    edge.tip = tippy(dummy, {
      onCreate: function(inst) {
        inst.popperInstance.reference = ref;
      },
      lazy: false,
      trigger: 'manual',
      content: () => {
        const content = document.createElement('div');
        content.innerHTML = Math.round(100*edge.data().weight) + '%';
        return content;
      },
    });
  });

  this._cy.edges().bind('mouseover', (evt) => evt.target.tip.show());
  this._cy.edges().bind('mouseout',  (evt) => evt.target.tip.hide());
}

CongraphPlotter.prototype._draw = function(nodes, edges, container) {
  let self = this;
  this._cy = cytoscape({
    container: document.querySelector(container),
    wheelSensitivity: 0.1,
    userZoomingEnabled: true,
    style: [{
      selector: 'node',
      style: {
        'background-color': '#428bca',
        'color': '#fff',
        'label': 'data(id)',
        'text-valign': 'center',
      },
    }, {
      selector: 'edge',
      style: {
        'width': 'data(thickness)',
        'opacity': 'data(opacity)',
        'line-color': '#000',
        'target-arrow-color': '#000',
        'target-arrow-shape': 'triangle',
        // Necessary to allow arrowheads
        'curve-style': 'bezier',
      },
    }],
  });

  nodes.forEach(node => {
    self._cy.add({
      group: 'nodes',
      data: { id: node.id },
    });
  });
  edges.forEach(edge => {
    const maxwt = 8;
    const minwt = 0.5;
    const max_opacity = 1.0;
    const min_opacity = 0.1;

    self._cy.add({
      group: 'edges',
      data: {
        id: edge.source + '_' + edge.target,
        source: edge.source,
        target: edge.target,
        weight: edge.weight,
        thickness: edge.weight*(maxwt - minwt) + minwt,
        opacity: edge.weight*(max_opacity - min_opacity) + min_opacity,
      },
    });
  });

  this._run_layout();
}

CongraphPlotter.prototype._run_layout = function() {
  this._cy.layout(this._layout_options[this._layout]).run();
}
</script>
<script type="text/javascript">function Util() {
}

Util.sort_ints = function(arr) {
  var converted = arr.map(function(a) {
    return parseInt(a, 10);
  });
  return converted.sort();
}

Util.hex2rgb = function(colour) {
  return {
    r: parseInt(colour.substring(1, 3), 16),
    g: parseInt(colour.substring(3, 5), 16),
    b: parseInt(colour.substring(5, 7), 16)
  };
}

Util.blend_colours = function(base_colour, alpha, bgcolour) {
  base_colour = Util.hex2rgb(base_colour);
  bgcolour = Util.hex2rgb(bgcolour);

  var rgb = {};
  Object.keys(base_colour).forEach(function(channel) {
    rgb[channel] = Math.round(alpha*base_colour[channel] + (1 - alpha)*bgcolour[channel]);
    rgb[channel] = rgb[channel].toString(16).padStart(2, "0");
  });
  var hex = '#' + rgb.r + rgb.g + rgb.b;
  return hex;
}

Util.transpose = function(mat) {
  let M = mat.length;
  let N = mat[0].length;
  let T = [];

  for(let n = 0; n < N; n++) {
    T.push([]);
    for(let m = 0; m < M; m++) {
      T[n].push(mat[m][n]);
    }
  }
  return T;
}

Util.find_clonal = function(parents) {
  let clonal = [];
  for(var idx = 0; idx < parents.length; idx++) {
    if(parents[idx] === 0) {
      clonal.push(idx + 1);
    }
  }
  return new Set(clonal);
}

Util.calc_ccf = function(phi, parents) {
  let S = phi[0].length;
  let clonal = Util.find_clonal(parents);
  let clonal_phi = [];

  for(let sidx = 0; sidx < S; sidx++) {
    clonal_phi.push(0);
    clonal.forEach(cidx => clonal_phi[sidx] += phi[cidx][sidx]);
    console.assert(clonal_phi[sidx] <= 1);
  }

  let ccf = phi.slice(1).map(P_k => {
    return P_k.map((P_ks, sidx) => P_ks / clonal_phi[sidx]);
  });

  return ccf;
}


function ColourAssigner() {
}

ColourAssigner._assign_from_palette = function(num_colours, scale_name) {
  let scales = {
    tableau10: d3.schemeTableau10,
    dark24: ['#2E91E5', '#E15F99', '#1CA71C', '#FB0D0D', '#DA16FF', '#222A2A', '#B68100', '#750D86', '#EB663B', '#511CFB', '#00A08B', '#FB00D1', '#FC0080', '#B2828D', '#6C7C32', '#778AAE', '#862A16', '#A777F1', '#620042', '#1616A7', '#DA60CA', '#6C4516', '#0D2A63', '#AF0038'],
    alphabet: ['#2E91E5', '#E15F99', '#1CA71C', '#FB0D0D', '#DA16FF', '#222A2A', '#B68100', '#750D86', '#EB663B', '#511CFB', '#00A08B', '#FB00D1', '#FC0080', '#B2828D', '#6C7C32', '#778AAE', '#862A16', '#A777F1', '#620042', '#1616A7', '#DA60CA', '#6C4516', '#0D2A63', '#AF0038'],
  };
  let scale = scale_name ? scales[scale_name] : scales.tableau10;

  var colours = [];
  // Start at cidx=1 rather than cidx=0 to keep colouring of phi matrix
  // consistent with what it was in past versions.
  for(var cidx = 1; colours.length < num_colours; cidx++) {
    if(cidx === scale.length) {
      cidx = 0;
    }
    colours.push(scale[cidx]);
  }
  return colours;
}

ColourAssigner._assign_from_husl = function(N) {
  let colours = [];
  let first_hue = 0.01;
  for(let idx = 0; idx < N; idx++) {
    let hue = 360*(first_hue + ((idx+1)/N)*(1 - first_hue));
    // Docs: https://github.com/hsluv/hsluv/tree/master/javascript
    colours.push(hsluv.hsluvToHex([hue, 66, 56]));
  }
  shuffle(colours);
  return colours;
}

ColourAssigner.assign_colours = function(N, use_husl=false) {
  if(use_husl) {
    return ColourAssigner._assign_from_husl(N);
  } else {
    return ColourAssigner._assign_from_palette(N);
  }
}

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
}

function resize_svg(elems) {
  elems.nodes().forEach(function(svg) {
    var box = svg.getBBox();
    // Padding is necessary, as `getBBox` doesn't account for borders around
    // nodes -- these would otherwise be clipped off.
    var padding = 6;
    var viewbox = [box.x - 0.5*padding, box.y - 0.5*padding, box.width + padding, box.height + padding];
    svg.setAttribute('viewBox', viewbox.join(' '));
    svg.setAttribute('width', viewbox[2]);
    svg.setAttribute('height', viewbox[3]);
  });
}
