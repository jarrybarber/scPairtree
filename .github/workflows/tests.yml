# Runs the test suite on fresh machines whenever code is pushed to main or a
# pull request is opened, and once a week. The install steps mirror the two
# installation methods in the README, so this also checks that they work.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # adds a "Run workflow" button on GitHub's Actions tab
  schedule:
    # Every Monday at 06:00 UTC. Dependencies are only given minimum versions,
    # so new releases of numpy, numba, etc. can break scPairtree even when its
    # own code hasn't changed. A weekly run catches this.
    - cron: "0 6 * * 1"

jobs:
  pip:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # The matrix runs this job once per entry: here, on the oldest and newest
    # Python versions scPairtree supports.
    strategy:
      fail-fast: false  # if one version fails, still finish the other
      matrix:
        python-version: ["3.10", "3.14"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Not an editable install, so the tests run against the installed copy
      # of scPairtree. This catches files missing from the package.
      - name: Install scPairtree
        run: pip install ".[test]"

      - name: Show installed versions
        run: pip list

      - name: Run tests
        run: pytest -v

  conda:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        # A login shell, so that `conda activate` works in each step.
        shell: bash -el {0}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest  # a conda install that uses conda-forge

      - name: Create the scPairtree environment
        run: conda env create -f environment.yml

      - name: Show installed versions
        run: |
          conda activate scPairtree
          conda list

      - name: Run tests
        run: |
          conda activate scPairtree
          pytest -v
